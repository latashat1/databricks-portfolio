resources:
  jobs:
    auto_insurance_telematics_etl_job:
      name: auto_insurance_telematics_etl_job
      tasks:
        - task_key: bronze_claims_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_auto_bronze_claims_autoloader.py
        - task_key: bronze_telematics_streaming
          notebook_task:
            notebook_path: ../notebooks/03_auto_bronze_telematics_streaming.py
        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_claims_ingestion
            - task_key: bronze_telematics_streaming
          notebook_task:
            notebook_path: ../notebooks/04_auto_silver_transformations.py
        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformations
          notebook_task:
            notebook_path: ../notebooks/05_auto_gold_aggregations.py
        - task_key: postgres_federation_enrichment
          depends_on:
            - task_key: silver_transformations
          notebook_task:
            notebook_path: ../notebooks/06_auto_postgres_federation.py
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Los_Angeles"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - "latasha16@hotmail.com"