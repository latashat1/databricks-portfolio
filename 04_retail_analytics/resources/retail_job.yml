resources:
  jobs:
    retail_analytics_etl_job:
      name: retail_analytics_etl_job
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_retail_bronze_autoloader_ingestion.py
        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/03_retail_silver_transformations.py
        - task_key: scd2_merge
          notebook_task:
            notebook_path: ../notebooks/04b_retail_scd2_merge.py
        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformations
            - task_key: scd2_merge
          notebook_task:
            notebook_path: ../notebooks/05_retail_gold_aggregations.py
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Los_Angeles"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - "latasha16@hotmail.com"